name: CI & Matrix Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Run unit tests
        run: go test -v ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: repaco-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: repaco-linux-arm64
          - goos: darwin
            goarch: amd64
            output_name: repaco-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: repaco-darwin-arm64
          - goos: windows
            goarch: amd64
            output_name: repaco-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.output_name }} ./cmd/repaco

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find dist -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Determine tag and title
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=repaco (latest build)" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            ### 42 Universal Tester - Binaries

            Download the standalone binary for your operating system and architecture:
            - **Linux (x86_64)**: `repaco-linux-amd64`
            - **Linux (ARM64)**: `repaco-linux-arm64`
            - **macOS Apple Silicon (M1/M2/M3/M4)**: `repaco-darwin-arm64`
            - **macOS Intel**: `repaco-darwin-amd64`
            - **Windows (x86_64)**: `repaco-windows-amd64.exe`

            #### Quick Install (macOS / Linux):
            ```bash
            # Example for macOS Apple Silicon:
            curl -Lo repaco https://github.com/${{ github.repository }}/releases/download/latest/repaco-darwin-arm64
            chmod +x repaco
            sudo mv repaco /usr/local/bin/
            ```
          files: release-assets/*
